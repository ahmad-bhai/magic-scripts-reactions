<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Scripts - Quantum Reaction Engine Pro</title>
    <link rel="shortcut icon" href="https://magic-scripts-reactions.vercel.app/logo.svg" type="image/x-icon">
    
    <!-- Font Awesome Pro Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #030712;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --panel-border: rgba(99, 102, 241, 0.25);
            --primary-purple: #8b5cf6;
            --cyan-glow: #06b6d4;
            --gold-glow: #f59e0b;
            --green-glow: #10b981;
            --red-glow: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #0f172a 0%, #030712 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow-1, .ambient-glow-2 {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.35;
            animation: floatLight 10s infinite alternate ease-in-out;
        }

        .ambient-glow-1 { background: var(--primary-purple); top: 5%; left: 10%; }
        .ambient-glow-2 { background: var(--cyan-glow); bottom: 5%; right: 10%; animation-delay: 5s; }

        @keyframes floatLight {
            0% { transform: scale(1) translateY(0); opacity: 0.3; }
            100% { transform: scale(1.2) translateY(-25px); opacity: 0.5; }
        }

        .app-container {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--panel-border);
            padding: 35px 24px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(139, 92, 246, 0.15);
            animation: slideUp 0.6s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .badge-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
        }

        .tier-free { color: var(--text-muted); border-color: rgba(148, 163, 184, 0.3); }
        .tier-premium { color: var(--gold-glow); border-color: rgba(245, 158, 11, 0.5); background: rgba(245, 158, 11, 0.1); }

        .btn-upgrade {
            background: linear-gradient(135deg, var(--gold-glow) 0%, #d97706 100%);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-upgrade:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.6);
        }

        .btn-upgrade.hidden-premium {
            display: none !important;
        }

        .brand-logo { text-align: center; margin-bottom: 25px; }
        .brand-logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.5);
        }

        .brand-logo h1 {
            font-size: 22px;
            font-weight: 800;
            margin-top: 10px;
            background: linear-gradient(135deg, #fff 0%, var(--cyan-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--cyan-glow);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
        }

        .locked-wrapper { position: relative; }
        .lock-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(3px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--gold-glow);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: 1px dashed rgba(245, 158, 11, 0.4);
        }

        .toggle-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.6);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: #fff; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background: linear-gradient(135deg, var(--green-glow) 0%, #059669 100%); }
        input:checked + .slider:before { transform: translateX(24px); }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-purple) 0%, var(--cyan-glow) 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(6, 182, 212, 0.4); }

        .custom-modal-backdrop {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(3, 7, 18, 0.85); 
            backdrop-filter: blur(10px);
            display: flex; 
            justify-content: center; 
            align-items: center;
            z-index: 99999; 
            opacity: 0; 
            visibility: hidden;
            pointer-events: none; 
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: 15px;
        }

        .custom-modal-backdrop.active { 
            opacity: 1; 
            visibility: visible;
            pointer-events: auto; 
        }

        .custom-modal {
            background: #0f172a; 
            border: 1px solid var(--panel-border);
            border-radius: 24px; 
            padding: 28px 22px; 
            width: 100%; 
            max-width: 480px;
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform: scale(0.85); 
            transition: transform 0.3s ease; 
            position: relative;
            max-height: 90vh; 
            overflow-y: auto;
        }

        .custom-modal-backdrop.active .custom-modal { transform: scale(1); }

        .modal-icon-wrap {
            width: 64px; height: 64px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px; font-size: 28px; color: var(--cyan-glow);
        }

        .modal-title { font-size: 21px; font-weight: 800; color: #fff; margin-bottom: 8px; }
        .modal-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.5; }

        .payment-box {
            background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 16px; text-align: left; margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 14px;
        }

        .pay-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pay-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pay-card-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .pay-card-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--cyan-glow);
            font-family: monospace;
            word-break: break-all;
        }

        .btn-copy { 
            background: rgba(6, 182, 212, 0.15); 
            border: 1px solid rgba(6, 182, 212, 0.3); 
            color: var(--cyan-glow); 
            padding: 6px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 5px;
            transition: all 0.2s ease;
        }
        .btn-copy:hover { background: rgba(6, 182, 212, 0.3); }

        .txid-section {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 16px;
            padding: 18px;
            text-align: left;
            margin-bottom: 22px;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.12);
        }

        .txid-section label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 800;
            color: var(--gold-glow);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .txid-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .txid-input-group input {
            width: 100%;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .txid-input-group input:focus {
            border-color: var(--gold-glow);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
        }

        .btn-verify-tx {
            width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-verify-tx:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        .btn-close-modal {
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: #fff;
            padding: 12px 20px; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            width: 100%; 
            transition: all 0.3s ease;
        }
        .btn-close-modal:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="app-container">
        <div class="top-header">
            <div class="badge-status tier-free" id="userTierDisplay">
                <i class="fa-solid fa-shield-halved"></i> <span id="tierLabel">FREE MODE</span>
            </div>
            <button class="btn-upgrade" id="btnUpgradeHeader" onclick="openPaymentModal()">
                <i class="fa-solid fa-crown"></i> AUTO UPGRADE
            </button>
        </div>

        <div class="brand-logo">
            <img src="https://magic-scripts-reactions.vercel.app/logo.svg" alt="Magic Scripts Logo">
            <h1>MAGIC REACTION ENGINE</h1>
        </div>

        <form id="engineForm" onsubmit="event.preventDefault(); processScriptEngine();">
            <div class="input-group">
                <label for="botToken"><i class="fa-solid fa-robot"></i> Telegram Bot Token</label>
                <input type="text" id="botToken" placeholder="123456789:ABCdefGHIjklMNOpqrs..." required onchange="checkTokenAccountStatus()">
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-toggle-on"></i> Engine Status</label>
                <div class="toggle-box">
                    <span id="toggleText" style="font-weight: 700; color: var(--green-glow);">Install Bot</span>
                    <label class="switch">
                        <input type="checkbox" id="toggleStatus" checked onchange="handleToggleChange()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="input-group">
                <label for="adminId"><i class="fa-solid fa-user-shield"></i> Admin Telegram ID</label>
                <input type="text" id="adminId" placeholder="e.g. 589423952">
            </div>

            <div class="input-group">
                <label for="welcomeMessage"><i class="fa-solid fa-comment-dots"></i> Welcome Message</label>
                <textarea id="welcomeMessage" rows="2" placeholder="Welcome {name} to Reaction Bot!"></textarea>
            </div>

            <div class="input-group">
                <label for="forceSubChannel"><i class="fa-solid fa-bullhorn"></i> Force Subscribe Channel</label>
                <div class="locked-wrapper">
                    <input type="text" id="forceSubChannel" placeholder="@YourChannelUsername">
                    <div class="lock-overlay" id="fsubLockOverlay" onclick="openPaymentModal()">
                        <i class="fa-solid fa-lock"></i> Auto Upgrade to Unlock Option
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-wand-magic-sparkles"></i> RUN ENGINE
            </button>
        </form>
    </div>

    <!-- Custom Alert Modal -->
    <div class="custom-modal-backdrop" id="customAlertModal">
        <div class="custom-modal">
            <div class="modal-icon-wrap" id="alertIconWrap">
                <i class="fa-solid fa-circle-info" id="alertIcon"></i>
            </div>
            <div class="modal-title" id="alertTitle">Notification</div>
            <div class="modal-desc" id="alertDesc">System message goes here.</div>
            <button class="btn-close-modal" onclick="closeCustomAlert()">OK, GOT IT</button>
        </div>
    </div>

    <!-- Payment Modal -->
    <div class="custom-modal-backdrop" id="paymentModal">
        <div class="custom-modal">
            <div class="modal-icon-wrap" style="color: var(--gold-glow); border-color: rgba(245, 158, 11, 0.3);">
                <i class="fa-solid fa-crown"></i>
            </div>
            <div class="modal-title">Instant Auto Upgrade</div>
            <div class="modal-desc">Automatic Payment Gateway. Unlimited Bots, High Speed, & Unlock Force Subscribe Channel!</div>

            <div class="payment-box">
                <div class="pay-card">
                    <div class="pay-card-header">
                        <span class="pay-card-title"><i class="fa-solid fa-wallet"></i> Binance Pay ID</span>
                        <button class="btn-copy" onclick="copyText('505638805')"><i class="fa-regular fa-copy"></i> Copy</button>
                    </div>
                    <div class="pay-card-value">505638805</div>
                </div>

                <div class="pay-card">
                    <div class="pay-card-header">
                        <span class="pay-card-title"><i class="fa-solid fa-coins"></i> USDT (TRC20) Address</span>
                        <button class="btn-copy" onclick="copyText('mytrc')"><i class="fa-regular fa-copy"></i> Copy</button>
                    </div>
                    <div class="pay-card-value">mytrc</div>
                </div>
            </div>

            <div class="txid-section">
                <label for="txHashInput"><i class="fa-solid fa-receipt"></i> ENTER TRANSACTION / ORDER ID</label>
                <div class="txid-input-group">
                    <input type="text" id="txHashInput" placeholder="Paste TxID / Order Hash here...">
                    <button class="btn-verify-tx" onclick="verifyPaymentAutomatically()">
                        <i class="fa-solid fa-circle-check"></i> VERIFY PAYMENT NOW
                    </button>
                </div>
            </div>

            <button class="btn-close-modal" style="background:transparent; border:1px solid rgba(255,255,255,0.15);" onclick="closePaymentModal()">Cancel</button>
        </div>
    </div>

    <script>
        const DOMAIN = "https://magic-scripts-reactions.vercel.app";
        let isPremiumUser = false;

        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('ms_token');
            const savedAdmin = localStorage.getItem('ms_admin');
            const savedMsg = localStorage.getItem('ms_msg');
            const savedToggle = localStorage.getItem('ms_toggle');

            if (savedToken) {
                document.getElementById('botToken').value = savedToken;
                checkTokenAccountStatus();
            }
            if (savedAdmin) document.getElementById('adminId').value = savedAdmin;
            if (savedMsg) document.getElementById('welcomeMessage').value = savedMsg;
            if (savedToggle !== null) {
                document.getElementById('toggleStatus').checked = (savedToggle === 'true');
                handleToggleChange();
            }
        });

        function handleToggleChange() {
            const toggle = document.getElementById('toggleStatus');
            const label = document.getElementById('toggleText');
            label.textContent = toggle.checked ? "Install Bot" : "Uninstall Bot";
            label.style.color = toggle.checked ? "var(--green-glow)" : "var(--red-glow)";
            localStorage.setItem('ms_toggle', toggle.checked);
        }

        // Server Backend status check (/p?id=)
        async function checkTokenAccountStatus() {
            const token = document.getElementById('botToken').value.trim();
            if (!token || token.length < 10) return;

            localStorage.setItem('ms_token', token);
            const botId = token.split(':')[0];

            // Local cache check for instant UI response
            const localPremState = localStorage.getItem(`ms_prem_${botId}`);
            if (localPremState === "true") {
                setPremiumUIStatus(true);
            }

            try {
                const res = await fetch(`${DOMAIN}/p?id=${botId}`);
                const data = await res.json();

                if (data && (data.paidStatus === true || data.status === "paid" || data.premium === true)) {
                    localStorage.setItem(`ms_prem_${botId}`, "true");
                    setPremiumUIStatus(true);
                } else if (localPremState !== "true") {
                    setPremiumUIStatus(false);
                }
            } catch (e) {
                if (localPremState !== "true") {
                    setPremiumUIStatus(false);
                }
            }
        }

        function setPremiumUIStatus(isPrem) {
            isPremiumUser = isPrem;
            const badge = document.getElementById('userTierDisplay');
            const label = document.getElementById('tierLabel');
            const overlay = document.getElementById('fsubLockOverlay');
            const upgradeBtn = document.getElementById('btnUpgradeHeader');

            if (isPrem) {
                badge.className = "badge-status tier-premium";
                label.textContent = "PREMIUM ENGINE UNLOCKED";
                overlay.style.display = "none";
                upgradeBtn.classList.add('hidden-premium');
            } else {
                badge.className = "badge-status tier-free";
                label.textContent = "FREE MODE";
                overlay.style.display = "flex";
                upgradeBtn.classList.remove('hidden-premium');
            }
        }

        async function processScriptEngine() {
            const token = document.getElementById('botToken').value.trim();
            const status = document.getElementById('toggleStatus').checked;
            const admin = document.getElementById('adminId').value.trim();
            const msg = document.getElementById('welcomeMessage').value.trim();
            const channel = isPremiumUser ? document.getElementById('forceSubChannel').value.trim() : "";

            if (!token) {
                showCustomAlert("Validation Error", "Please enter a valid Telegram Bot Token!", "fa-triangle-exclamation", "var(--red-glow)");
                return;
            }

            localStorage.setItem('ms_admin', admin);
            localStorage.setItem('ms_msg', msg);

            const botId = token.split(':')[0];
            const targetUrl = `${DOMAIN}/api?token=${token}&status=${status}&admin=${admin}&msg=${encodeURIComponent(msg)}&channel=${encodeURIComponent(channel)}&userId=${botId}`;

            try {
                showCustomAlert("Processing", "Executing engine operation, please wait...", "fa-spinner fa-spin", "var(--cyan-glow)");
                const res = await fetch(targetUrl);
                const data = await res.json();

                if (data.status === "success") {
                    showCustomAlert("Success", data.message || "Bot status updated successfully!", "fa-circle-check", "var(--green-glow)");
                } else {
                    showCustomAlert("Engine Error", data.message || data.telegram_error || "Action failed!", "fa-triangle-exclamation", "var(--red-glow)");
                }
            } catch (e) {
                showCustomAlert("Execution Dispatched", "Bot settings updated and submitted to reaction server!", "fa-bolt", "var(--cyan-glow)");
            }
        }

        // Strict Auto-Payment Verification API Logic
        async function verifyPaymentAutomatically() {
            const txHash = document.getElementById('txHashInput').value.trim();
            const token = document.getElementById('botToken').value.trim();

            if (!txHash) {
                showCustomAlert("Required Field", "Please input Transaction/Order ID!", "fa-triangle-exclamation", "var(--red-glow)");
                return;
            }

            if (!token) {
                showCustomAlert("Missing Token", "Please enter Bot Token first before upgrading!", "fa-triangle-exclamation", "var(--red-glow)");
                return;
            }

            const botId = token.split(':')[0];
            showCustomAlert("Auto Verifying", "Verifying Payment with Blockchain & Gateway...", "fa-arrows-rotate fa-spin", "var(--cyan-glow)");

            try {
                const res = await fetch(`${DOMAIN}/api/pay-verify?tx=${encodeURIComponent(txHash)}&id=${encodeURIComponent(botId)}`);
                
                if (!res.ok) {
                    throw new Error("Server response error");
                }

                const data = await res.json();

                if (data.status === "verified" || data.success === true || data.paidStatus === true) {
                    localStorage.setItem(`ms_prem_${botId}`, "true");
                    closePaymentModal();
                    setPremiumUIStatus(true);
                    showCustomAlert("Account Upgraded!", "Payment Verified successfully! Premium access activated.", "fa-circle-check", "var(--green-glow)");
                } else {
                    closePaymentModal();
                    showCustomAlert("Payment Failed", data.message || "Invalid Transaction ID or Payment not received yet.", "fa-triangle-exclamation", "var(--red-glow)");
                }
            } catch (e) {
                closePaymentModal();
                showCustomAlert("Verification Failed", "Unable to verify TxID with server. Please check your network and TxID.", "fa-triangle-exclamation", "var(--red-glow)");
            }
        }

        function showCustomAlert(title, desc, iconClass, iconColor) {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertDesc').textContent = desc;
            
            const iconEl = document.getElementById('alertIcon');
            const iconWrap = document.getElementById('alertIconWrap');
            
            iconEl.className = `fa-solid ${iconClass || 'fa-circle-info'}`;
            iconWrap.style.color = iconColor || "var(--cyan-glow)";
            
            document.getElementById('customAlertModal').classList.add('active');
        }

        function closeCustomAlert() {
            document.getElementById('customAlertModal').classList.remove('active');
        }

        function openPaymentModal() {
            document.getElementById('paymentModal').classList.add('active');
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').classList.remove('active');
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            showCustomAlert("Copied", `Copied to clipboard: ${text}`, "fa-copy", "var(--cyan-glow)");
        }
    </script>
</body>
</html>
