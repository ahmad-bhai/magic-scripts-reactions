<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Scripts - Reaction Bot Manager</title>
    <link rel="shortcut icon" href="https://magic-scripts-reactions.vercel.app/logo.svg" type="image/x-icon">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #0f172a 100%);
            --panel-bg: rgba(30, 41, 59, 0.55);
            --panel-border: rgba(99, 102, 241, 0.25);
            --primary-glow: #6366f1;
            --secondary-glow: #a855f7;
            --cyan-glow: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glowing Background Animations */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(130px);
            z-index: -1;
            opacity: 0.45;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }

        body::before {
            background: var(--primary-glow);
            top: 10%;
            left: 15%;
        }

        body::after {
            background: var(--secondary-glow);
            bottom: 10%;
            right: 15%;
            animation-delay: 5s;
        }

        @keyframes floatGlow {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            100% { transform: translateY(-40px) scale(1.2) rotate(45deg); }
        }

        .container {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--panel-border);
            padding: 40px 35px;
            border-radius: 28px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(99, 102, 241, 0.15);
            transform: translateY(30px);
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            to { transform: translateY(0); opacity: 1; }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .logo-area img:hover {
            transform: rotate(8deg) scale(1.08);
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.8);
        }

        .logo-area h1 {
            font-size: 26px;
            font-weight: 800;
            margin-top: 14px;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a855f7 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        label i {
            color: var(--cyan-glow);
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: var(--cyan-glow);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
            background: rgba(15, 23, 42, 0.9);
        }

        textarea {
            resize: none;
            height: 90px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.65);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s ease;
        }

        .toggle-label-status {
            font-size: 15px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 32px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 34px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 3px;
            bottom: 3px;
            background-color: #f1f5f9;
            transition: .4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }

        input:checked + .slider:before {
            transform: translateX(28px);
        }

        input:not(:checked) + .slider {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.4;
        }

        .btn-magic {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #06b6d4 100%);
            background-size: 200% auto;
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.35);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-magic:hover {
            background-position: right center;
            box-shadow: 0 6px 25px rgba(6, 182, 212, 0.5);
            transform: translateY(-2px);
        }

        .btn-magic:active {
            transform: translateY(1px);
        }

        /* Modern Loading & Feedback Overlay */
        .loader-box {
            display: none;
            text-align: center;
            margin-top: 25px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .quantum-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid transparent;
            border-top-color: var(--cyan-glow);
            border-bottom-color: var(--secondary-glow);
            border-radius: 50%;
            animation: quantumSpin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            margin: 0 auto 12px;
        }

        @keyframes quantumSpin {
            to { transform: rotate(360deg); }
        }

        .response-panel {
            margin-top: 25px;
            padding: 16px;
            border-radius: 14px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            display: none;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .msg-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #4ade80;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.1);
        }

        .msg-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <img src="https://magic-scripts-reactions.vercel.app/logo.svg" alt="Magic Scripts Logo" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150'">
            <h1>MAGIC SCRIPTS</h1>
        </div>
        
        <form id="magicForm" onsubmit="event.preventDefault(); triggerMagicEngine();">
            <div class="form-group">
                <label for="botToken"><i class="fa-solid fa-robot"></i> Bot Token</label>
                <input type="text" id="botToken" placeholder="Enter your Telegram bot token...">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-sliders"></i> System Action</label>
                <div class="toggle-container">
                    <span class="toggle-label-status" id="toggleStatusText">Install Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="statusToggle" checked onchange="updateToggleUI()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="adminId"><i class="fa-solid fa-user-shield"></i> Admin Telegram ID</label>
                <input type="text" id="adminId" placeholder="e.g. 589423952">
            </div>

            <div class="form-group">
                <label for="welcomeMsg"><i class="fa-solid fa-comment-dots"></i> Welcome Message</label>
                <textarea id="welcomeMsg" placeholder="Hello {name}, reaction bot is active!"></textarea>
                <div class="hint">Use <b>{name}</b> to dynamically greet users by their Telegram name.</div>
            </div>

            <div class="form-group">
                <label for="fsubChannel"><i class="fa-solid fa-bullhorn"></i> Force Subscribe Channel (Optional)</label>
                <input type="text" id="fsubChannel" placeholder="e.g. @Magic_Scripts_Official or link">
                <div class="hint">Users must join this channel to use the bot. Leave blank to skip.</div>
            </div>

            <button type="submit" class="btn-magic">
                <i class="fa-solid fa-wand-magic-sparkles"></i>RUN MAGIC</button>
        </form>

        <div class="loader-box" id="magicLoader">
            <div class="quantum-spinner"></div>
            <p style="color: var(--text-muted); font-size: 13px;">Applying script settings...</p>
        </div>

        <div class="response-panel" id="feedbackPanel"></div>
    </div>

    <script>
        // DOM Elements
        const botTokenInput = document.getElementById('botToken');
        const statusToggle = document.getElementById('statusToggle');
        const toggleStatusText = document.getElementById('toggleStatusText');
        const adminIdInput = document.getElementById('adminId');
        const welcomeMsgInput = document.getElementById('welcomeMsg');
        const fsubChannelInput = document.getElementById('fsubChannel');
        const magicLoader = document.getElementById('magicLoader');
        const feedbackPanel = document.getElementById('feedbackPanel');

        // Restore Configuration from LocalStorage
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('ms_botToken')) botTokenInput.value = localStorage.getItem('ms_botToken');
            if (localStorage.getItem('ms_adminId')) adminIdInput.value = localStorage.getItem('ms_adminId');
            if (localStorage.getItem('ms_welcomeMsg')) welcomeMsgInput.value = localStorage.getItem('ms_welcomeMsg');
            if (localStorage.getItem('ms_fsubChannel')) fsubChannelInput.value = localStorage.getItem('ms_fsubChannel');

            const savedToggleState = localStorage.getItem('ms_toggleState');
            if (savedToggleState !== null) {
                statusToggle.checked = (savedToggleState === 'true');
            }
            updateToggleUI();
        });

        // Real-time Event Listeners for Storage
        botTokenInput.addEventListener('input', () => localStorage.setItem('ms_botToken', botTokenInput.value.trim()));
        adminIdInput.addEventListener('input', () => localStorage.setItem('ms_adminId', adminIdInput.value.trim()));
        welcomeMsgInput.addEventListener('input', () => localStorage.setItem('ms_welcomeMsg', welcomeMsgInput.value.trim()));
        fsubChannelInput.addEventListener('input', () => localStorage.setItem('ms_fsubChannel', fsubChannelInput.value.trim()));

        // Toggle Switch State Update
        function updateToggleUI() {
            if (statusToggle.checked) {
                toggleStatusText.textContent = "Install Mode";
                toggleStatusText.style.color = "#4ade80";
            } else {
                toggleStatusText.textContent = "Uninstall Mode";
                toggleStatusText.style.color = "#f87171";
            }
            localStorage.setItem('ms_toggleState', statusToggle.checked);
        }

        // Action Trigger Execution
        function triggerMagicEngine() {
            const token = botTokenInput.value.trim();
            const isAdminInstall = statusToggle.checked;
            const adminId = adminIdInput.value.trim();
            const msg = welcomeMsgInput.value.trim();
            const fsubChannel = fsubChannelInput.value.trim();

            feedbackPanel.style.display = 'none';
            feedbackPanel.className = 'response-panel';

            if (!token) {
                feedbackPanel.textContent = "Please enter a valid Telegram Bot Token!";
                feedbackPanel.classList.add('msg-error');
                feedbackPanel.style.display = 'block';
                return;
            }

            magicLoader.style.display = 'block';

            const apiStatus = isAdminInstall ? "true" : "false";
            const encodedMsg = encodeURIComponent(msg);
            const encodedChannel = encodeURIComponent(fsubChannel);
            
            const endpointsUrl = `https://magic-scripts-reactions.vercel.app/api?token=${token}&status=${apiStatus}&admin=${adminId}&msg=${encodedMsg}&channel=${encodedChannel}`;

            fetch(endpointsUrl)
                .then(res => console.log('Configuration Dispatched'))
                .catch(err => console.error('Network Error:', err));

            setTimeout(() => {
                magicLoader.style.display = 'none';

                if (isAdminInstall) {
                    feedbackPanel.textContent = "Bot configured and deployed successfully!";
                } else {
                    feedbackPanel.textContent = "Bot uninstalled successfully!";
                }
                
                feedbackPanel.classList.add('msg-success');
                feedbackPanel.style.display = 'block';
            }, 5000);
        }
    </script>
</body>
</html>
